# Builds the app on Expo's servers. Run it from GitHub → Actions →
# "EAS Build" → Run workflow. Needed once per native change (e.g. new SDK);
# day-to-day code changes ship through EAS Update instead.
name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [ios, android, all]
        default: ios
      profile:
        description: Build profile
        type: choice
        options: [production, preview]
        default: production
      submit:
        description: Submit to App Store / Play Store when done (production only)
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile || bun install
      - run: npx tsc --noEmit
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Start build
        run: |
          SUBMIT=""
          if [ "${{ inputs.submit }}" = "true" ] && [ "${{ inputs.profile }}" = "production" ]; then SUBMIT="--auto-submit"; fi
          eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --no-wait $SUBMIT
