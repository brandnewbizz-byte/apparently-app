# Publishes an over-the-air (EAS) update to the "production" channel whenever
# master changes, so app builds with the same version (runtime) get the new
# JavaScript without a store release. Native changes (new packages, app.json
# plugins, version bumps) still need a new build from the "production" profile.
name: Update Production

on:
  push:
    branches: ['master']
  workflow_dispatch: {}

jobs:
  update_production:
    name: Publish update to production
    type: update
    params:
      channel: production
